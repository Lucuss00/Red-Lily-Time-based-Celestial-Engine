<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Red Lily - Time-based Celestial Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thai Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Kanit', 'Sarabun', sans-serif;
            background-color: #070a12;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Glassmorphic UI Elements */
        .glass-panel {
            background: rgba(18, 25, 46, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(120, 170, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .chip-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chip-btn:hover, .chip-btn:active {
            transform: translateY(-2px);
            background: rgba(65, 105, 225, 0.35);
            border-color: rgba(140, 190, 255, 0.8);
            box-shadow: 0 4px 15px rgba(65, 105, 225, 0.4);
        }
        /* Glow animation for primary button */
        @keyframes btnGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.5), 0 0 30px rgba(220, 38, 38, 0.2); }
            50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.8), 0 0 45px rgba(239, 68, 68, 0.4); }
        }
        .btn-glow {
            animation: btnGlow 3s infinite;
        }
        /* Custom Scrollbar & Canvas Container */
        #canvas-container {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            border-radius: 18px;
            overflow: hidden;
            max-height: 98vh;
            max-width: 98vw;
            aspect-ratio: 720 / 1280;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Main Canvas Frame Container -->
    <div id="canvas-container" class="relative border border-slate-800/80">
        
        <!-- Render Canvas -->
        <canvas id="mainCanvas" width="720" height="1280"></canvas>

        <!-- Top HUD Controls Overlay -->
        <div class="absolute top-3 left-3 right-3 flex flex-col gap-2 z-10 pointer-events-none">
            <div class="glass-panel rounded-xl p-2.5 px-4 flex items-center justify-between pointer-events-auto">
                <div class="flex items-center gap-2.5">
                    <span id="celestialIcon" class="text-xl">☀️</span>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <div id="timeDisplay" class="text-sm font-semibold tracking-wide text-amber-200 font-mono">12:00:00 น. (GMT+7)</div>
                        </div>
                        <div id="modeDisplay" class="text-[11px] text-sky-200/80 font-light">Real-time GMT+7 Tracking</div>
                    </div>
                </div>

                <!-- HUD Quick Action Buttons -->
                <div class="flex items-center gap-1.5">
                    <button id="btnPause" class="glass-card hover:bg-white/20 text-xs p-1.5 px-2.5 rounded-lg transition active:scale-95 flex items-center gap-1" title="พัก / เล่นต่อ">
                        <span id="pauseIcon">⏸️</span>
                    </button>
                    <button id="btnReset" class="glass-card hover:bg-white/20 text-xs p-1.5 px-2.5 rounded-lg transition active:scale-95 flex items-center gap-1" title="เริ่มโตใหม่">
                        <span>🔄</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Application Script Engine -->
    <script>
        // =========================================================================
        // Seeded Pseudo Random Number Generator (Mulberry32 & Gaussian)
        // =========================================================================
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function createRng(seed) {
            const gen = mulberry32(seed);
            return {
                random: gen,
                uniform: (min, max) => min + (max - min) * gen(),
                normal: (mean = 0, std = 1) => {
                    let u = 0, v = 0;
                    while (u === 0) u = gen();
                    while (v === 0) v = gen();
                    return mean + std * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                },
                triangular: (low, high, mode) => {
                    const u = gen();
                    const c = (mode - low) / (high - low);
                    if (u < c) return low + Math.sqrt(u * (high - low) * (mode - low));
                    return high - Math.sqrt((1 - u) * (high - low) * (high - mode));
                },
                integers: (min, max) => Math.floor(min + gen() * (max - min))
            };
        }

        const rngMain = createRng(11);

        // =========================================================================
        // Math & Interpolation Helpers
        // =========================================================================
        const W = 720, H = 1280;
        const S = W / 720.0;
        const FPS = 60;
        const T_STEM = 4.0;
        const T_B0 = 5.0, T_B1 = 15.0;
        const gx = W / 2, gy = H * 0.82;
        const HS = 380 * S;

        function smooth(x) {
            x = Math.max(0, Math.min(1, x));
            return x * x * (3 - 2 * x);
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function interp(xVal, xArr, yArr) {
            if (xVal <= xArr[0]) return yArr[0];
            if (xVal >= xArr[xArr.length - 1]) return yArr[yArr.length - 1];
            for (let i = 0; i < xArr.length - 1; i++) {
                if (xVal >= xArr[i] && xVal <= xArr[i + 1]) {
                    const k = (xVal - xArr[i]) / (xArr[i + 1] - xArr[i]);
                    return yArr[i] + k * (yArr[i + 1] - yArr[i]);
                }
            }
            return yArr[0];
        }

        // =========================================================================
        // Celestial Engine (24-Hour Palette, Sun, Moon, Stars, Sky & Clouds)
        // =========================================================================
        const SKY_PALETTES = [
            { h: 0.0,  top: [10, 14, 32],   bot: [25, 40, 75] },    // Midnight
            { h: 4.5,  top: [14, 18, 40],   bot: [35, 50, 90] },    // Pre-dawn
            { h: 5.8,  top: [45, 55, 115],  bot: [180, 110, 100] }, // Dawn
            { h: 6.8,  top: [65, 120, 210], bot: [255, 185, 125] }, // Sunrise
            { h: 9.0,  top: [60, 145, 235], bot: [170, 220, 252] }, // Morning
            { h: 12.0, top: [55, 150, 240], bot: [180, 228, 255] }, // Noon
            { h: 15.5, top: [65, 140, 230], bot: [195, 215, 245] }, // Afternoon
            { h: 17.2, top: [50, 85, 175],  bot: [245, 170, 95] },  // Golden Hour
            { h: 18.2, top: [32, 45, 105],  bot: [225, 100, 70] },  // Sunset
            { h: 19.2, top: [18, 26, 65],   bot: [75, 55, 100] },   // Twilight
            { h: 21.0, top: [12, 16, 36],   bot: [30, 45, 80] },    // Dusk
            { h: 24.0, top: [10, 14, 32],   bot: [25, 40, 75] },    // Midnight Loop
        ];

        function getSkyColors(hour) {
            const h = hour % 24.0;
            for (let i = 0; i < SKY_PALETTES.length - 1; i++) {
                const p0 = SKY_PALETTES[i];
                const p1 = SKY_PALETTES[i + 1];
                if (p0.h <= h && h <= p1.h) {
                    const k = (h - p0.h) / (p1.h - p0.h + 1e-6);
                    const top = [
                        Math.round(lerp(p0.top[0], p1.top[0], k)),
                        Math.round(lerp(p0.top[1], p1.top[1], k)),
                        Math.round(lerp(p0.top[2], p1.top[2], k))
                    ];
                    const bot = [
                        Math.round(lerp(p0.bot[0], p1.bot[0], k)),
                        Math.round(lerp(p0.bot[1], p1.bot[1], k)),
                        Math.round(lerp(p0.bot[2], p1.bot[2], k))
                    ];
                    return { top, bot };
                }
            }
            return { top: SKY_PALETTES[0].top, bot: SKY_PALETTES[0].bot };
        }

        function getCelestialInfo(hour) {
            const h = hour % 24.0;
            const isNight = (h < 6.0) || (h >= 18.0);
            let p = 0;
            if (!isNight) {
                p = (h - 6.0) / 12.0;
            } else {
                p = (h >= 18.0) ? (h - 18.0) / 12.0 : (h + 6.0) / 12.0;
            }
            const cx = lerp(W * 0.14, W * 0.86, p);
            const cy = (H * 0.58) - Math.sin(Math.PI * p) * (H * 0.43);
            return { isNight, cx, cy, p };
        }

        // Draw Pointillist Sun onto Offscreen Canvas
        function drawPointillistSun(ctx, cx, cy, rng, hour) {
            const h = hour % 24.0;
            const noonDiff = Math.abs(h - 12.0) / 6.0;

            // 1. Solar Corona Rays
            const N_CORONA = 1400;
            for (let i = 0; i < N_CORONA; i++) {
                const rCor = Math.pow(rng.uniform(28 * S, 210 * S), 1.15) / Math.pow(210 * S, 0.15);
                const rayBase = (Math.floor(rng.uniform(0, 8)) * (2 * Math.PI / 8));
                const thCor = rayBase + rng.normal(0, 0.22);
                const px = Math.round(cx + rCor * Math.cos(thCor));
                const py = Math.round(cy + rCor * Math.sin(thCor));

                if (px >= 0 && px < W && py >= 0 && py < H) {
                    const fade = Math.max(0, Math.min(1, 1.0 - (rCor / (210 * S))));
                    const alpha = Math.round(140 * Math.pow(fade, 1.8)) / 255;
                    if (alpha > 0.01) {
                        const rC = 255;
                        const gC = Math.round(lerp(180, 245, (1.0 - noonDiff) * fade));
                        const bC = Math.round(lerp(80, 205, (1.0 - noonDiff) * fade));
                        const rad = rng.random() < 0.75 ? 1 : 2;
                        ctx.fillStyle = `rgba(${rC},${gC},${bC},${alpha})`;
                        ctx.fillRect(px, py, rad, rad);
                    }
                }
            }

            // 2. Dense Core
            const N_CORE = 850;
            for (let i = 0; i < N_CORE; i++) {
                const rCore = Math.sqrt(rng.random()) * (34 * S);
                const thCore = rng.uniform(0, 2 * Math.PI);
                const px = Math.round(cx + rCore * Math.cos(thCore));
                const py = Math.round(cy + rCore * Math.sin(thCore));

                if (px >= 0 && px < W && py >= 0 && py < H) {
                    const fade = Math.max(0, Math.min(1, 1.0 - (rCore / (34 * S))));
                    const alpha = Math.round(lerp(180, 255, fade)) / 255;
                    const rC = 255;
                    const gC = Math.round(lerp(220, 255, 1.0 - noonDiff * 0.3));
                    const bC = Math.round(lerp(150, 245, 1.0 - noonDiff * 0.5));
                    const rad = rng.random() < 0.65 ? 1 : 2;
                    ctx.fillStyle = `rgba(${rC},${gC},${bC},${alpha})`;
                    ctx.fillRect(px, py, rad, rad);
                }
            }
        }

        // Draw Pointillist Crescent Moon onto Offscreen Canvas
        function drawPointillistMoon(ctx, cx, cy, rng) {
            // Lunar Halo
            const N_HALO = 900;
            for (let i = 0; i < N_HALO; i++) {
                const rH = Math.pow(rng.uniform(22 * S, 160 * S), 1.1) / Math.pow(160 * S, 0.1);
                const thH = rng.uniform(0, 2 * Math.PI);
                const px = Math.round(cx + rH * Math.cos(thH));
                const py = Math.round(cy + rH * Math.sin(thH));

                if (px >= 0 && px < W && py >= 0 && py < H) {
                    const fade = Math.max(0, Math.min(1, 1.0 - (rH / (160 * S))));
                    const alpha = Math.round(110 * Math.pow(fade, 1.6)) / 255;
                    if (alpha > 0.01) {
                        ctx.fillStyle = `rgba(210,230,255,${alpha})`;
                        ctx.fillRect(px, py, 1, 1);
                    }
                }
            }

            // Crescent Core
            const N_MOON = 1000;
            let count = 0;
            const rMax = 30 * S;
            while (count < N_MOON) {
                const candX = rng.uniform(-rMax, rMax);
                const candY = rng.uniform(-rMax, rMax);
                if (candX * candX + candY * candY <= rMax * rMax) {
                    const cutX = candX - 11 * S;
                    const cutY = candY;
                    if (cutX * cutX + cutY * cutY >= (rMax * 0.88) * (rMax * 0.88)) {
                        const px = Math.round(cx + candX);
                        const py = Math.round(cy + candY);
                        if (px >= 0 && px < W && py >= 0 && py < H) {
                            const alpha = rng.uniform(190, 255) / 255;
                            const rC = rng.integers(235, 255);
                            const gC = rng.integers(245, 255);
                            const rad = rng.random() < 0.70 ? 1 : 2;
                            ctx.fillStyle = `rgba(${rC},${gC},255,${alpha})`;
                            ctx.fillRect(px, py, rad, rad);
                        }
                        count++;
                    }
                }
            }
        }

        // Draw Twinkling Night Stars
        function drawNightStars(ctx, rng) {
            const N_STARS = 140;
            for (let i = 0; i < N_STARS; i++) {
                const px = Math.round(rng.uniform(20, W - 20));
                const py = Math.round(rng.uniform(20, H * 0.65));
                const alpha = rng.uniform(90, 240) / 255;
                const rad = rng.random() < 0.85 ? 1 : 2;
                ctx.fillStyle = `rgba(240,248,255,${alpha})`;
                ctx.fillRect(px, py, rad, rad);
            }
        }

        // Generate Pre-rendered Sky Base Canvas
        function createSkyCanvas(hour) {
            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const { top, bot } = getSkyColors(hour);
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
            grad.addColorStop(1, `rgb(${bot[0]},${bot[1]},${bot[2]})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const { isNight, cx, cy } = getCelestialInfo(hour);
            const rngCel = createRng(Math.floor(hour * 100) + 123);

            if (isNight) {
                drawNightStars(ctx, rngCel);
                drawPointillistMoon(ctx, cx, cy, rngCel);
            } else {
                drawPointillistSun(ctx, cx, cy, rngCel, hour);
            }
            return canvas;
        }

        // Pointillist Cloud Surfaces Generator
        function createCloudCanvas(width, height, seed) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const rngC = createRng(seed);

            const numPuffs = 8;
            const puffs = [];
            for (let i = 0; i < numPuffs; i++) {
                puffs.push({
                    px: rngC.uniform(width * 0.18, width * 0.82),
                    py: rngC.triangular(height * 0.35, height * 0.60, height * 0.78),
                    rx: rngC.uniform(width * 0.12, width * 0.22),
                    ry: rngC.uniform(height * 0.15, height * 0.30)
                });
            }

            const N_PTS = 3800;
            for (let i = 0; i < N_PTS; i++) {
                const idx = rngC.integers(0, numPuffs);
                const p = puffs[idx];
                const ptX = p.px + rngC.normal(0, 0.45) * p.rx;
                const ptY = p.py + rngC.normal(0, 0.42) * p.ry;

                if (ptX >= 0 && ptX < width && ptY >= 0 && ptY < height) {
                    const yVal = ptY / height;
                    let r, g, b, alpha;

                    if (yVal < 0.45) {
                        r = Math.round(lerp(250, 255, rngC.random()));
                        g = Math.round(lerp(252, 255, rngC.random()));
                        b = 255;
                        alpha = rngC.uniform(160, 230) / 255;
                    } else if (yVal < 0.70) {
                        r = Math.round(lerp(235, 250, rngC.random()));
                        g = Math.round(lerp(242, 252, rngC.random()));
                        b = Math.round(lerp(250, 255, rngC.random()));
                        alpha = rngC.uniform(130, 200) / 255;
                    } else {
                        r = Math.round(lerp(185, 215, rngC.random()));
                        g = Math.round(lerp(210, 230, rngC.random()));
                        b = Math.round(lerp(238, 248, rngC.random()));
                        alpha = rngC.uniform(90, 160) / 255;
                    }

                    const rad = rngC.random() < 0.70 ? 1 : 2;
                    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                    ctx.fillRect(Math.round(ptX), Math.round(ptY), rad, rad);
                }
            }
            return canvas;
        }

        const CLOUD_CONFIGS = [
            { w: Math.round(520 * S), h: Math.round(200 * S), y: Math.round(90 * S),  speed: 4.5 * S,  seed: 101 },
            { w: Math.round(440 * S), h: Math.round(170 * S), y: Math.round(270 * S), speed: 7.5 * S,  seed: 202 },
            { w: Math.round(490 * S), h: Math.round(190 * S), y: Math.round(470 * S), speed: 5.5 * S,  seed: 303 }
        ];

        let cachedSkyBase = null;
        let lastRenderedHour = -999.0;
        let cloudCanvases = null;

        function getBackground(t, hour, ctxTarget) {
            if (!cachedSkyBase || Math.abs(hour - lastRenderedHour) > 0.02) {
                cachedSkyBase = createSkyCanvas(hour);
                lastRenderedHour = hour;
            }

            if (!cloudCanvases) {
                cloudCanvases = CLOUD_CONFIGS.map(c => createCloudCanvas(c.w, c.h, c.seed));
            }

            ctxTarget.drawImage(cachedSkyBase, 0, 0);

            CLOUD_CONFIGS.forEach((c, i) => {
                const totalSpan = W + c.w;
                const offset = i * (totalSpan / CLOUD_CONFIGS.length);
                const curX = (t * c.speed + offset) % totalSpan - c.w;
                ctxTarget.drawImage(cloudCanvases[i], Math.round(curX), Math.round(c.y));
            });
        }

        // =========================================================================
        // Red Lily Plant & Flower Physical Simulation Data Structures
        // =========================================================================
        function midrib(L, a0, curl, K = 40) {
            const us = new Float32Array(K + 1);
            const r = new Float32Array(K + 1);
            const h = new Float32Array(K + 1);
            const ds = L / K;
            let sumR = 0, sumH = 0;
            us[0] = 0; r[0] = 0; h[0] = 0;

            for (let i = 1; i <= K; i++) {
                us[i] = i / K;
                const al = a0 + curl * Math.pow(us[i], 1.6);
                sumR += Math.sin(al) * ds;
                sumH += Math.cos(al) * ds;
                r[i] = sumR;
                h[i] = sumH;
            }
            return { us, r, h };
        }

        // 1. Petals Data Setup
        const NP = 2300;
        const petals = [];
        for (let k = 0; k < 6; k++) {
            const outer = (k % 2 === 0);
            const pu = new Float32Array(NP);
            const pv = new Float32Array(NP);
            const prof = new Float32Array(NP);
            const keep = new Uint8Array(NP);
            const base = new Float32Array(NP * 3);

            const stopsX = [0, 0.35, 0.7, 1.0];
            const stopR = [170, 222, 245, 255];
            const stopG = [10, 16, 24, 42];
            const stopB = [20, 24, 32, 48];

            for (let i = 0; i < NP; i++) {
                pu[i] = Math.pow(rngMain.random(), 0.85);
                pv[i] = rngMain.uniform(-1, 1);
                prof[i] = Math.pow(Math.sin(Math.PI * Math.pow(pu[i], 0.7)), 0.9);
                keep[i] = Math.abs(pv[i]) <= 1 ? 1 : 0;

                let rC = interp(pu[i], stopsX, stopR);
                let gC = interp(pu[i], stopsX, stopG);
                let bC = interp(pu[i], stopsX, stopB);

                // Midrib highlight
                if (Math.abs(pv[i]) < 0.07 && pu[i] < 0.55) {
                    rC = 255; gC = 95; bC = 45;
                } else if (rngMain.random() < 0.10 && pu[i] < 0.6 && Math.abs(pv[i]) < 0.75) {
                    // Freckles
                    rC = 92; gC = 4; bC = 18;
                }

                // Edge brightness
                if (Math.abs(pv[i]) > 0.88) {
                    rC *= 1.08; gC *= 1.08; bC *= 1.08;
                }

                const noise = 0.82 + 0.35 * rngMain.random();
                base[i * 3 + 0] = Math.min(255, rC * noise);
                base[i * 3 + 1] = Math.min(255, gC * noise);
                base[i * 3 + 2] = Math.min(255, bC * noise);
            }

            petals.push({
                phi: (k * 60 + 8) * Math.PI / 180,
                L: (outer ? 300 : 280) * S,
                Wm: (outer ? 64 : 72) * S,
                ac: outer ? 0.10 : 0.05,
                ao: outer ? 1.05 : 0.82,
                curl: outer ? 0.95 : 0.75,
                pu, pv, prof, base, keep
            });
        }

        // 2. Stem Data Setup
        const NS = 3200;
        const st_s = new Float32Array(NS);
        const st_dx = new Float32Array(NS);
        const st_col = new Float32Array(NS * 3);
        for (let i = 0; i < NS; i++) {
            st_s[i] = rngMain.random();
            st_dx[i] = rngMain.normal(0, 1) * (3.2 * S) * (1 - 0.5 * st_s[i]);
            const noise = 0.8 + 0.4 * rngMain.random();
            st_col[i * 3 + 0] = lerp(35, 100, st_s[i]) * noise;
            st_col[i * 3 + 1] = lerp(145, 215, st_s[i]) * noise;
            st_col[i * 3 + 2] = lerp(50, 95, st_s[i]) * noise;
        }

        // 3. Leaves Data Setup
        const leavesConfig = [
            { s0: 0.10, Lf: 190, side: 1 },
            { s0: 0.24, Lf: 175, side: -1 },
            { s0: 0.40, Lf: 150, side: 1 },
            { s0: 0.56, Lf: 120, side: -1 }
        ];
        const leaves = leavesConfig.map(cfg => {
            const n = 900;
            const u = new Float32Array(n);
            const v = new Float32Array(n);
            const prof = new Float32Array(n);
            const col = new Float32Array(n * 3);

            for (let i = 0; i < n; i++) {
                u[i] = Math.pow(rngMain.random(), 0.9);
                v[i] = rngMain.uniform(-1, 1);
                prof[i] = Math.pow(Math.sin(Math.PI * Math.pow(u[i], 0.8)), 0.8);

                let rC = lerp(35, 110, u[i]);
                let gC = lerp(145, 220, u[i]);
                let bC = lerp(55, 105, u[i]);

                if (Math.abs(v[i]) < 0.08) {
                    rC = 170; gC = 235; bC = 150;
                }
                const noise = 0.8 + 0.4 * rngMain.random();
                col[i * 3 + 0] = Math.min(255, rC * noise);
                col[i * 3 + 1] = Math.min(255, gC * noise);
                col[i * 3 + 2] = Math.min(255, bC * noise);
            }
            return { s0: cfg.s0, L: cfg.Lf * S, side: cfg.side, n, u, v, prof, col };
        });

        // 4. Soil Mound Data
        const NG = 5000;
        const so_dx = new Float32Array(NG);
        const so_y = new Float32Array(NG);
        const so_col = new Float32Array(NG * 3);
        for (let i = 0; i < NG; i++) {
            so_dx[i] = rngMain.uniform(-340, 340) * S;
            const mound = (1 - Math.pow(so_dx[i] / (340 * S), 2)) * 55 * S;
            so_y[i] = gy - mound * Math.sqrt(rngMain.random()) + rngMain.normal(0, 1.5);
            so_col[i * 3 + 0] = lerp(80, 130, rngMain.random()) * 0.8;
            so_col[i * 3 + 1] = lerp(65, 100, rngMain.random()) * 0.8;
            so_col[i * 3 + 2] = lerp(42, 65, rngMain.random()) * 0.8;
        }

        // 5. Dust Particles
        const ND = 450;
        const d_x = new Float32Array(ND);
        const d_y = new Float32Array(ND);
        const d_sp = new Float32Array(ND);
        const d_ph = new Float32Array(ND);
        const d_f = new Float32Array(ND);
        for (let i = 0; i < ND; i++) {
            d_x[i] = rngMain.random() * W;
            d_y[i] = rngMain.random() * H;
            d_sp[i] = rngMain.uniform(6, 22) * S;
            d_ph[i] = rngMain.random() * 6.28;
            d_f[i] = rngMain.uniform(1, 4);
        }

        // Pollen Spores
        const NF = 140;
        const f_off = new Float32Array(NF);
        const f_ph = new Float32Array(NF);
        const f_dr = new Float32Array(NF);
        const f_sp = new Float32Array(NF);
        for (let i = 0; i < NF; i++) {
            f_off[i] = rngMain.random();
            f_ph[i] = rngMain.random() * 6.28;
            f_dr[i] = rngMain.uniform(-80, 80) * S;
            f_sp[i] = rngMain.uniform(0.05, 0.12);
        }

        // 6. Stamens
        const stam = [];
        for (let k = 0; k < 6; k++) {
            const an = new Float32Array(35 * 2);
            for (let j = 0; j < 35 * 2; j++) an[j] = rngMain.normal(0, 1);
            stam.push({ phi: (k * 60 + 38) * Math.PI / 180, an });
        }

        function stemX(s, t) {
            const sway = 10 * S * Math.sin(0.9 * t);
            return gx + 30 * S * Math.sin(2.2 * s) + sway * s * s;
        }

        function stemY(s) {
            return gy - s * HS;
        }

        // Point particle sorting container
        let pointPool = [];

        // Main Render Loop onto Canvas
        function renderScene(t, hour, ctx) {
            pointPool = [];

            const g = smooth(t / T_STEM);
            const e = smooth((t - T_B0) / (T_B1 - T_B0));
            const rev = smooth((t - T_STEM + 0.3) / 1.6);

            const hx = stemX(1.0, t);
            const hy = stemY(1.0);

            // 1. Dust Particles
            for (let i = 0; i < ND; i++) {
                const tw = 0.35 + 0.65 * (Math.sin(t * d_f[i] + d_ph[i]) > 0.2 ? 1 : 0);
                const yy = ((d_y[i] - t * d_sp[i]) % H + H) % H;
                pointPool.push({
                    x: d_x[i], y: yy, z: -1000,
                    r: 255 * tw * 0.65, g: 245 * tw * 0.65, b: 210 * tw * 0.65
                });
            }

            // 2. Soil Base
            for (let i = 0; i < NG; i++) {
                pointPool.push({
                    x: so_dx[i] + gx, y: so_y[i], z: -500,
                    r: so_col[i * 3 + 0], g: so_col[i * 3 + 1], b: so_col[i * 3 + 2]
                });
            }

            // 3. Stem Growth
            for (let i = 0; i < NS; i++) {
                if (st_s[i] <= g) {
                    const s = st_s[i];
                    pointPool.push({
                        x: stemX(s, t) + st_dx[i], y: stemY(s), z: -100,
                        r: st_col[i * 3 + 0], g: st_col[i * 3 + 1], b: st_col[i * 3 + 2]
                    });
                }
            }

            // 4. Leaves Flutter
            leaves.forEach(lf => {
                const lg = Math.max(0, Math.min(1, (g - lf.s0) * 2.5));
                if (lg > 0.01) {
                    const L = lf.L * lg;
                    const a0 = 0.85 + 0.09 * Math.sin(t * 1.5 + lf.s0 * 4.5);
                    const curl = 1.10 + 0.18 * Math.cos(t * 1.3 + lf.s0 * 3.8);
                    const { us, r, h } = midrib(L, a0, curl);

                    const bx = stemX(lf.s0, t);
                    const by = stemY(lf.s0);

                    for (let i = 0; i < lf.n; i++) {
                        const uVal = lf.u[i];
                        const vVal = lf.v[i];
                        const rr = interp(uVal, us, r);
                        const hh = interp(uVal, us, h);

                        const wavePhase = t * 2.6 - uVal * 3.6 + lf.s0 * 6.0;
                        const waveY = Math.sin(wavePhase) * Math.pow(uVal, 1.6) * (12 * S);
                        const waveX = Math.cos(wavePhase * 0.8) * Math.pow(uVal, 1.5) * (7 * S);

                        const wid = 15 * S * lf.prof[i] * lg;
                        const px = bx + lf.side * (rr + vVal * wid * 0.35 + waveX);
                        const py = by - hh + vVal * wid + waveY;

                        pointPool.push({
                            x: px, y: py, z: -90,
                            r: lf.col[i * 3 + 0], g: lf.col[i * 3 + 1], b: lf.col[i * 3 + 2]
                        });
                    }
                }
            });

            // 5. Red Lily Petals Bloom Sequence
            if (rev > 0.01) {
                const psi = 0.25 + t * 0.22;
                const tau = 0.5;
                const cp = Math.cos(psi), sp = Math.sin(psi);
                const ct = Math.cos(tau), st = Math.sin(tau);
                const swayT = Math.sin(t * 0.8) * 0.02;

                petals.forEach(p => {
                    const Ls = p.L * (0.45 + 0.55 * e) * (0.35 + 0.65 * rev);
                    const a0 = lerp(p.ac, p.ao, e);
                    const curl = (0.12 + 0.88 * e) * p.curl;
                    const { us, r, h } = midrib(Ls, a0, curl);

                    for (let i = 0; i < NP; i++) {
                        const puVal = p.pu[i];
                        if (puVal <= rev && p.keep[i]) {
                            const pvVal = p.pv[i];
                            const prVal = p.prof[i];
                            const rr = interp(puVal, us, r);
                            const hh = interp(puVal, us, h);
                            const wid = p.Wm * (0.55 + 0.45 * e) * prVal * (0.35 + 0.65 * rev);
                            const ph = p.phi;

                            const X = rr * Math.cos(ph) - pvVal * wid * Math.sin(ph);
                            const Z = rr * Math.sin(ph) + pvVal * wid * Math.cos(ph);
                            const Y = hh + (pvVal * pvVal) * wid * (0.30 * (1 - e) - 0.25 * e);

                            const Xp = X * cp + Z * sp;
                            const Zp = -X * sp + Z * cp;
                            const sy = Y * ct - Zp * st;

                            const shade = 0.55 + 0.45 * Math.max(0, Math.min(1, Zp / p.L * 0.8 + 0.5));

                            let rC = p.base[i * 3 + 0];
                            let gC = p.base[i * 3 + 1];
                            let bC = p.base[i * 3 + 2];

                            const tint = (1 - e) * Math.max(0, Math.min(1, puVal * 1.3)) * 0.5;
                            rC = rC * (1 - tint) + 235 * tint;
                            gC = gC * (1 - tint) + 30 * tint;
                            bC = bC * (1 - tint) + 48 * tint;

                            pointPool.push({
                                x: hx + Xp + swayT * sy, y: hy - sy, z: Zp,
                                r: rC * shade, g: gC * shade, b: bC * shade
                            });
                        }
                    }
                });

                // Stamens & Golden Anthers
                if (e > 0.28) {
                    const sr = smooth((e - 0.28) / 0.4);
                    stam.forEach(sdat => {
                        const Ls = 215 * S * (0.4 + 0.6 * e) * sr;
                        const { us, r, h } = midrib(Ls, lerp(0.15, 0.62, e), 0.55 * e);

                        // Filament dots
                        for (let j = 0; j < 45; j++) {
                            const uVal = (j / 45);
                            const rr = interp(uVal, us, r);
                            const hh = interp(uVal, us, h);
                            const ph = sdat.phi;
                            const X = rr * Math.cos(ph), Z = rr * Math.sin(ph), Y = hh;
                            const Xp = X * cp + Z * sp;
                            const Zp = -X * sp + Z * cp;
                            const sy = Y * ct - Zp * st;

                            pointPool.push({
                                x: hx + Xp, y: hy - sy, z: Zp + 5,
                                r: 255, g: 215, b: 205
                            });
                        }

                        // Anther Pollen cluster
                        const tx = r[r.length - 1] * Math.cos(sdat.phi);
                        const tz = r[r.length - 1] * Math.sin(sdat.phi);
                        const ty = h[h.length - 1];
                        const txp = tx * cp + tz * sp;
                        const tzp = -tx * sp + tz * cp;
                        const tsy = ty * ct - tzp * st;

                        for (let j = 0; j < 35; j++) {
                            const anx = sdat.an[j * 2 + 0] * 5 * S;
                            const any = sdat.an[j * 2 + 1] * 5 * S;
                            const noise = 0.8 + 0.4 * rngMain.random();

                            pointPool.push({
                                x: hx + txp + anx * 1.6, y: hy - tsy + any * 0.7, z: tzp + 6,
                                r: Math.min(255, 255 * noise),
                                g: Math.min(255, 140 * noise),
                                b: Math.min(255, 20 * noise)
                            });
                        }
                    });
                }
            }

            // 6. Floating Pollen Particles
            if (e > 0.6) {
                const fa = smooth((e - 0.6) / 0.4);
                for (let i = 0; i < NF; i++) {
                    const q = (t * f_sp[i] + f_off[i]) % 1.0;
                    const fx = hx + f_dr[i] * q + Math.sin(q * 7 + f_ph[i]) * 25 * S;
                    const fy = (hy - 110 * S) + q * (gy - hy + 90 * S);
                    const fade = (1 - q) * fa;

                    const isGold = f_ph[i] > 3.1;
                    const rC = (isGold ? 255 : 255) * fade;
                    const gC = (isGold ? 245 : 130) * fade;
                    const bC = (isGold ? 160 : 80) * fade;

                    pointPool.push({ x: fx, y: fy, z: 300, r: rC, g: gC, b: bC });
                }
            }

            // Sort points by depth Z ascending
            pointPool.sort((a, b) => a.z - b.z);

            // Draw Sky & Celestial background
            getBackground(t, hour, ctx);

            // Draw sorted particles onto canvas
            const imgData = ctx.getImageData(0, 0, W, H);
            const data = imgData.data;

            for (let i = 0; i < pointPool.length; i++) {
                const pt = pointPool[i];
                const ix = Math.floor(pt.x);
                const iy = Math.floor(pt.y);

                if (ix >= 0 && ix < W - 2 && iy >= 0 && iy < H - 2) {
                    const rVal = Math.min(255, Math.max(0, Math.round(pt.r)));
                    const gVal = Math.min(255, Math.max(0, Math.round(pt.g)));
                    const bVal = Math.min(255, Math.max(0, Math.round(pt.b)));

                    // 2x2 particle pixel stamping
                    const offsets = [
                        (iy * W + ix) * 4,
                        (iy * W + (ix + 1)) * 4,
                        ((iy + 1) * W + ix) * 4
                    ];

                    for (let k = 0; k < offsets.length; k++) {
                        const idx = offsets[k];
                        data[idx]     = rVal;
                        data[idx + 1] = gVal;
                        data[idx + 2] = bVal;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // =========================================================================
        // Application Controller, Time Helpers & Event Listeners
        // =========================================================================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        // State Variables
        let simTime = 0.0;
        let currentHour = 12.0;
        let isPaused = false;
        let lastTimestamp = performance.now();

        // DOM Element Handles
        const timeDisplay = document.getElementById('timeDisplay');
        const modeDisplay = document.getElementById('modeDisplay');
        const celestialIcon = document.getElementById('celestialIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        // Get Real System Time in Thailand (GMT+7) with Millisecond Precision
        function getThailandHour() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const thDate = new Date(utc + (3600000 * 7));
            const hours = thDate.getHours();
            const minutes = thDate.getMinutes();
            const seconds = thDate.getSeconds();
            const ms = thDate.getMilliseconds();
            return (hours % 24) + (minutes / 60) + (seconds / 3600) + (ms / 3600000);
        }

        function formatRealTimeHMS() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const thDate = new Date(utc + (3600000 * 7));
            const hStr = thDate.getHours().toString().padStart(2, '0');
            const mStr = thDate.getMinutes().toString().padStart(2, '0');
            const sStr = thDate.getSeconds().toString().padStart(2, '0');
            return `${hStr}:${mStr}:${sStr} น. (GMT+7)`;
        }

        function updateHUD() {
            timeDisplay.innerText = formatRealTimeHMS();

            const { isNight } = getCelestialInfo(currentHour);
            if (isNight) {
                celestialIcon.innerText = "🌙";
                modeDisplay.innerText = "Nighttime - Moon & Stars";
            } else {
                celestialIcon.innerText = "☀️";
                modeDisplay.innerText = "Daytime - Sun";
            }
        }

        // HUD Control Event Listeners
        document.getElementById('btnPause').addEventListener('click', () => {
            isPaused = !isPaused;
            pauseIcon.innerText = isPaused ? "▶️" : "⏸️";
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            simTime = 0.0;
        });

        // Global Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                isPaused = !isPaused;
                pauseIcon.innerText = isPaused ? "▶️" : "⏸️";
                e.preventDefault();
            } else if (e.key === 'r' || e.key === 'R') {
                simTime = 0.0;
            }
        });

        // Main Animation Loop
        function animate(timestamp) {
            const dt = Math.min(0.1, (timestamp - lastTimestamp) / 1000.0);
            lastTimestamp = timestamp;

            if (!isPaused) {
                simTime += dt;
            }

            // Continuously track real Thailand time every frame
            currentHour = getThailandHour();
            updateHUD();

            renderScene(simTime, currentHour, ctx);
            requestAnimationFrame(animate);
        }

        // Launch Engine Loop
        requestAnimationFrame((ts) => {
            lastTimestamp = ts;
            animate(ts);
        });
    </script>
</body>
</html>
